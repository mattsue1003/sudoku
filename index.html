<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數獨產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }

        /* A4 Page Layout */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 1cm auto;
            border: 1px #D1D5DB solid;
            background: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 10mm;
        }
        
        /* --- START: ROBUST SUDOKU GRID STYLES --- */
        .sudoku-grid {
            border-collapse: collapse;
        }
        .sudoku-grid td {
            border: 1px solid #9ca3af; /* Default thin border for all sides */
            padding: 0; /* Critical for inner div to fill the cell */
        }
        /* This inner div is the key to fixing the PDF rendering issue */
        .cell-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 500;
        }
        .sudoku-grid td.subgrid-bg {
            background-color: #f3f4f6; /* gray-100 */
        }

        /* Common Outer Borders - Applied to all grid sizes */
        .sudoku-grid tr:first-child td { border-top: 3px solid #111827; }
        .sudoku-grid tr td:first-child { border-left: 3px solid #111827; }
        .sudoku-grid tr td:last-child { border-right: 3px solid #111827; }
        .sudoku-grid tr:last-child td { border-bottom: 3px solid #111827; }

        /* Subgrid Borders for 4x4 */
        .grid-4x4 tr:nth-child(2n) td { border-bottom: 2px solid #111827; }
        .grid-4x4 tr td:nth-child(2n) { border-right: 2px solid #111827; }
        .grid-4x4 { width: 60mm; height: 60mm; }
        .grid-4x4 td { width: 15mm; height: 15mm; }

        /* Subgrid Borders for 6x6 */
        .grid-6x6 tr:nth-child(2n) td { border-bottom: 2px solid #111827; }
        .grid-6x6 tr td:nth-child(3n) { border-right: 2px solid #111827; }
        .grid-6x6 { width: 84mm; height: 84mm; }
        .grid-6x6 td { width: 14mm; height: 14mm; }
        
        /* Subgrid Borders for 9x9 */
        .grid-9x9 tr:nth-child(3n) td { border-bottom: 2px solid #111827; }
        .grid-9x9 tr td:nth-child(3n) { border-right: 2px solid #111827; }
        .grid-9x9 { width: 126mm; height: 126mm; }
        .grid-9x9 td { width: 14mm; height: 14mm; }
        /* --- END: ROBUST SUDOKU GRID STYLES --- */

        .sudoku-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease-in-out;
        }
        
        .sudoku-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Style for solved numbers in the answer grid */
        .solved-number {
            color: #b91c1c; /* red-700 */
            font-weight: 700; /* bold */
        }
        
        /* Print Styles */
        @media print {
            body, html {
                margin: 0;
                padding: 0;
                background-color: white;
            }
            .controls, .header {
                display: none;
            }
            .page {
                margin: 0;
                border: none;
                box-shadow: none;
                padding: 10mm; /* Reduce padding for printing */
            }
        }
    </style>
</head>
<body class="bg-slate-100">

    <div class="container mx-auto p-4 md:p-8">

        <!-- Header -->
        <header class="header text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-800">數獨產生器</h1>
            <p class="text-slate-600 mt-2">選擇您的數獨偏好，即可產生可供列印的 A4 題目卷。</p>
            <div class="text-slate-600 mt-4 text-sm">
                <p>
                    <a href="https://www.facebook.com/chungmenghsiu" target="_blank" class="text-indigo-600 hover:underline">設計者：鍾孟修 職能治療師</a>
                </p>
                <p class="mt-1">
                    <a href="https://www.books.com.tw/products/0011022363?sloc=main" target="_blank" class="text-indigo-600 hover:underline">新書：讓你健康不失智的體智能</a>
                </p>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls bg-white p-6 rounded-2xl shadow-lg max-w-2xl mx-auto mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Size Selection -->
                <div>
                    <label class="block text-lg font-semibold text-slate-700 mb-2">尺寸</label>
                    <select id="sudoku-size" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                        <option value="4" selected>4x4 (6題/頁)</option>
                        <option value="6">6x6 (4題/頁)</option>
                        <option value="9">9x9 (2題/頁)</option>
                    </select>
                </div>

                <!-- Difficulty Selection -->
                <div>
                    <label class="block text-lg font-semibold text-slate-700 mb-2">難易度</label>
                    <select id="sudoku-difficulty" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                        <option value="beginner" selected>初學</option>
                        <option value="intermediate">中等</option>
                        <option value="expert">專家</option>
                    </select>
                </div>

                <!-- Pages Selection -->
                <div>
                    <label for="page-count" class="block text-lg font-semibold text-slate-700 mb-2">份數</label>
                    <input type="number" id="page-count" value="1" min="1" max="20" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Title Controls -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 border-t border-slate-200 pt-6">
                 <div>
                    <label for="custom-title" class="block text-lg font-semibold text-slate-700 mb-2">自訂標題</label>
                    <input type="text" id="custom-title" value="愛迪樂日照數獨練習" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label for="title-size-slider" class="block text-lg font-semibold text-slate-700 mb-2">標題大小 <span id="title-size-value" class="font-normal text-slate-500">32px</span></label>
                    <input type="range" id="title-size-slider" min="16" max="48" value="32" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                </div>
                 <div>
                    <label for="sudoku-scale-slider" class="block text-lg font-semibold text-slate-700 mb-2">題目大小 <span id="sudoku-scale-value" class="font-normal text-slate-500">100%</span></label>
                    <input type="range" id="sudoku-scale-slider" min="70" max="110" value="100" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
            
            <!-- Answer Options -->
            <div class="mt-6 border-t border-slate-200 pt-6">
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="generate-answers" class="h-5 w-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                    <label for="generate-answers" class="text-lg font-semibold text-slate-700">產出答案</label>
                </div>
                <div id="answer-placement-options" class="mt-4 pl-8 hidden">
                     <div class="flex items-center gap-4 mb-2">
                         <input type="radio" id="answers-grouped" name="answer-placement" value="grouped" checked class="h-4 w-4 border-gray-300 text-indigo-600 focus:ring-indigo-500">
                         <label for="answers-grouped" class="text-slate-700">答案統一於最後</label>
                     </div>
                     <div class="flex items-center gap-4">
                         <input type="radio" id="answers-interleaved" name="answer-placement" value="interleaved" class="h-4 w-4 border-gray-300 text-indigo-600 focus:ring-indigo-500">
                         <label for="answers-interleaved" class="text-slate-700">答案附於題目下頁</label>
                     </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                <button id="generate-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 transition-transform transform hover:scale-105 shadow-md focus:outline-none focus:ring-4 focus:ring-indigo-300">
                    產生題目
                </button>
                <button id="download-pdf-btn" class="w-full sm:w-auto bg-slate-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-slate-700 transition-transform transform hover:scale-105 shadow-md focus:outline-none focus:ring-4 focus:ring-slate-300">
                    PDF檔案產出下載
                </button>
            </div>
            <div id="loading-indicator" class="text-center mt-4 text-indigo-600 font-semibold hidden">
                <p>正在產生題目，請稍候...</p>
            </div>
        </div>
        
        <!-- Printable Area -->
        <div id="printable-area"></div>

    </div>

    <script>
    class SudokuGenerator {
        constructor(size = 9) {
            this.size = size;
            if (size === 6) {
                this.boxHeight = 2;
                this.boxWidth = 3;
            } else {
                this.sqrtSize = Math.sqrt(size);
                if (!Number.isInteger(this.sqrtSize)) {
                    throw new Error("Sudoku size must be a perfect square (or 6).");
                }
                this.boxHeight = this.sqrtSize;
                this.boxWidth = this.sqrtSize;
            }
            this.grid = this.createEmptyGrid();
        }

        createEmptyGrid() {
            return Array.from({ length: this.size }, () => Array(this.size).fill(0));
        }

        // Main generation function
        generate(difficulty) {
            this.grid = this.createEmptyGrid();
            this.fillGrid();
            const solution = JSON.parse(JSON.stringify(this.grid));
            
            const puzzle = JSON.parse(JSON.stringify(this.grid));
            this.removeNumbers(puzzle, difficulty);
            
            return { puzzle, solution };
        }

        // Fill the grid with a valid solution using backtracking
        fillGrid() {
            const numbers = Array.from({ length: this.size }, (_, i) => i + 1);
            this.shuffle(numbers);
            this.solve(numbers);
        }

        // Backtracking solver
        solve(numbers) {
            for (let r = 0; r < this.size; r++) {
                for (let c = 0; c < this.size; c++) {
                    if (this.grid[r][c] === 0) {
                        for (const num of numbers) {
                            if (this.isValid(r, c, num)) {
                                this.grid[r][c] = num;
                                if (this.solve(numbers)) {
                                    return true;
                                }
                                this.grid[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        // Check if a number is valid in a given position
        isValid(row, col, num) {
            // Check row
            for (let c = 0; c < this.size; c++) {
                if (this.grid[row][c] === num) return false;
            }
            // Check column
            for (let r = 0; r < this.size; r++) {
                if (this.grid[r][col] === num) return false;
            }
            // Check subgrid
            const startRow = row - (row % this.boxHeight);
            const startCol = col - (col % this.boxWidth);

            for (let r = 0; r < this.boxHeight; r++) {
                for (let c = 0; c < this.boxWidth; c++) {
                    if (this.grid[startRow + r][startCol + c] === num) return false;
                }
            }
            return true;
        }
        
        // Remove numbers to create a puzzle
        removeNumbers(puzzle, difficulty) {
            const totalCells = this.size * this.size;
            let cellsToRemove = 0;

            const removalRates = {
                4: { beginner: 0.4, intermediate: 0.5, expert: 0.6 },
                6: { beginner: 0.5, intermediate: 0.6, expert: 0.7 },
                9: { beginner: 0.55, intermediate: 0.65, expert: 0.75 }
            };

            const rate = removalRates[this.size][difficulty] || 0.6;
            cellsToRemove = Math.floor(totalCells * rate);

            let attempts = cellsToRemove;
            while (attempts > 0) {
                const row = Math.floor(Math.random() * this.size);
                const col = Math.floor(Math.random() * this.size);

                if (puzzle[row][col] !== 0) {
                    puzzle[row][col] = 0;
                    attempts--;
                }
            }
        }

        // Fisher-Yates shuffle algorithm
        shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    }


    document.addEventListener('DOMContentLoaded', () => {
        const sizeSelect = document.getElementById('sudoku-size');
        const difficultySelect = document.getElementById('sudoku-difficulty');
        const pageCountInput = document.getElementById('page-count');
        const customTitleInput = document.getElementById('custom-title');
        const titleSizeSlider = document.getElementById('title-size-slider');
        const titleSizeValue = document.getElementById('title-size-value');
        const sudokuScaleSlider = document.getElementById('sudoku-scale-slider');
        const sudokuScaleValue = document.getElementById('sudoku-scale-value');
        const generateBtn = document.getElementById('generate-btn');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');
        const printableArea = document.getElementById('printable-area');
        const loadingIndicator = document.getElementById('loading-indicator');
        const loadingText = loadingIndicator.querySelector('p');
        const generateAnswersCheckbox = document.getElementById('generate-answers');
        const answerPlacementOptions = document.getElementById('answer-placement-options');
        
        // --- Event Listeners ---
        titleSizeSlider.addEventListener('input', applyLiveStyleChanges);
        sudokuScaleSlider.addEventListener('input', applyLiveStyleChanges);
        customTitleInput.addEventListener('input', applyLiveStyleChanges);

        generateAnswersCheckbox.addEventListener('change', () => {
            answerPlacementOptions.classList.toggle('hidden', !generateAnswersCheckbox.checked);
        });

        generateBtn.addEventListener('click', () => {
            const size = parseInt(sizeSelect.value);
            const difficulty = difficultySelect.value;
            const pageCount = parseInt(pageCountInput.value);

            if (isNaN(size) || isNaN(pageCount) || pageCount <= 0) {
                alert('請輸入有效的份數。');
                return;
            }
            
            loadingText.textContent = '正在產生題目，請稍候...';
            loadingIndicator.classList.remove('hidden');
            
            setTimeout(() => {
                generatePuzzles(size, difficulty, pageCount);
                loadingIndicator.classList.add('hidden');
            }, 50);

        });
        
        downloadPdfBtn.addEventListener('click', async () => {
            if(printableArea.children.length === 0){
                alert('請先產生題目後再進行下載。');
                return;
            }

            loadingText.textContent = '正在產生 PDF，請稍候...';
            loadingIndicator.classList.remove('hidden');

            const { jsPDF } = window.jspdf;
            const pages = printableArea.querySelectorAll('.page');
            const pdf = new jsPDF('p', 'mm', 'a4', true);
            
            try {
                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    const canvas = await html2canvas(page, { scale: 2, useCORS: true });
                    const imgData = canvas.toDataURL('image/png');
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight(), undefined, 'NONE');
                }
                pdf.save('sudoku_puzzles.pdf');
            } catch (error) {
                console.error("PDF generation failed:", error);
                alert("PDF 檔案產生失敗，請稍後再試。");
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        });

        function generatePuzzles(size, difficulty, pageCount) {
            const puzzlesPerPageMap = { 4: 6, 6: 4, 9: 2 };
            const puzzlesPerPage = puzzlesPerPageMap[size];
            const totalPuzzles = pageCount * puzzlesPerPage;

            const generateAnswers = generateAnswersCheckbox.checked;
            const answerPlacement = document.querySelector('input[name="answer-placement"]:checked').value;

            // 1. Generate all data first
            const allPuzzlesData = [];
            for (let i = 0; i < totalPuzzles; i++) {
                const generator = new SudokuGenerator(size);
                allPuzzlesData.push(generator.generate(difficulty));
            }

            printableArea.innerHTML = '';

            // 2. Render pages based on options
            const questionPages = [];
            const answerPages = [];

            // Create page contents
            for (let i = 0; i < pageCount; i++) {
                const qPage = createPageElement();
                const aPage = generateAnswers ? createPageElement("答案") : null;
                const pageData = allPuzzlesData.slice(i * puzzlesPerPage, (i + 1) * puzzlesPerPage);

                pageData.forEach((data, index) => {
                    const puzzleIndex = i * puzzlesPerPage + index + 1;
                    qPage.appendChild(createPuzzleElement(data.puzzle, puzzleIndex, size));
                    if (aPage) {
                       aPage.appendChild(createAnswerElement(data.puzzle, data.solution, puzzleIndex, size));
                    }
                });
                questionPages.push(qPage);
                if (aPage) answerPages.push(aPage);
            }

            // Append pages to DOM
            if (generateAnswers && answerPlacement === 'interleaved') {
                for(let i=0; i<questionPages.length; i++) {
                    printableArea.appendChild(questionPages[i]);
                    if(answerPages[i]) printableArea.appendChild(answerPages[i]);
                }
            } else {
                questionPages.forEach(page => printableArea.appendChild(page));
                answerPages.forEach(page => printableArea.appendChild(page));
            }
            
            applyLiveStyleChanges();
        }

        function createPageElement(titlePrefix = "") {
            const page = document.createElement('div');
            page.className = 'page';
            const titleEl = document.createElement('h2');
            titleEl.className = 'page-title';
            if (titlePrefix) {
                titleEl.setAttribute('data-title-prefix', titlePrefix + ' ');
            }
            page.appendChild(titleEl);
            return page;
        }
        
        function createPuzzleElement(puzzle, index, size) {
            const container = createBaseElement(`數獨 #${index}`);
            const table = createSudokuTable(size, (r, c) => puzzle[r][c] !== 0 ? puzzle[r][c] : '');
            container.appendChild(table);
            return container;
        }

        function createAnswerElement(puzzle, solution, index, size) {
            const container = createBaseElement(`答案 #${index}`);
            const table = createSudokuTable(size, (r, c) => solution[r][c], '', puzzle);
            container.appendChild(table);
            return container;
        }
        
        function createBaseElement(titleText) {
            const container = document.createElement('div');
            container.className = 'sudoku-container';
            const title = document.createElement('div');
            title.className = 'sudoku-title';
            title.textContent = titleText;
            container.appendChild(title);
            return container;
        }

        function createSudokuTable(size, cellContentFunc, customClass = '', originalPuzzle = null) {
            const table = document.createElement('table');
            table.className = `sudoku-grid grid-${size}x${size} ${customClass}`;
            let boxHeight, boxWidth;
            if (size === 6) { [boxHeight, boxWidth] = [2, 3]; } 
            else { const sqrtSize = Math.sqrt(size); [boxHeight, boxWidth] = [sqrtSize, sqrtSize]; }
            
            for (let r = 0; r < size; r++) {
                const row = table.insertRow();
                for (let c = 0; c < size; c++) {
                    const cell = row.insertCell();
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'cell-content';
                    contentDiv.textContent = cellContentFunc(r, c);
                    cell.appendChild(contentDiv);
                    
                    if (originalPuzzle && originalPuzzle[r][c] === 0) {
                        contentDiv.classList.add('solved-number');
                    }

                    const boxRow = Math.floor(r / boxHeight);
                    const boxCol = Math.floor(c / boxWidth);
                    if ((boxRow + boxCol) % 2 === 0) cell.classList.add('subgrid-bg');
                }
            }
            return table;
        }

        function applyLiveStyleChanges() {
             if (printableArea.children.length === 0) return;
            const titleSize = titleSizeSlider.value;
            const sudokuScale = sudokuScaleSlider.value;
            const customTitle = customTitleInput.value;
            
            titleSizeValue.textContent = `${titleSize}px`;
            sudokuScaleValue.textContent = `${sudokuScale}%`;

            printableArea.querySelectorAll('.page-title').forEach(titleEl => {
                const prefix = titleEl.getAttribute('data-title-prefix') || '';
                if (customTitle.trim() !== '') {
                    titleEl.textContent = prefix + customTitle;
                    titleEl.style.width = '100%';
                    titleEl.style.textAlign = 'center';
                    titleEl.style.fontWeight = 'bold';
                    titleEl.style.marginBottom = '8mm';
                    titleEl.style.alignSelf = 'flex-start';
                    titleEl.style.fontSize = `${titleSize}px`;
                } else {
                    titleEl.textContent = '';
                    titleEl.style.marginBottom = '0';
                }
            });

            printableArea.querySelectorAll('.sudoku-container').forEach(container => {
                container.style.transform = `scale(${sudokuScale / 100})`;
            });
        }
    });
    </script>
</body>
</html>
